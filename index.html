<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F9FAF7]">

  <title>TalentPulse AI Enterprise Platform - Intelligence OS v2.8</title>

            'on-surface': '#191C1B',
            'on-surface-variant': '#3D4A40',
            'inverse-surface': '#2E312F',
            'inverse-on-surface': '#F0F1EE',

            'outline-variant': '#BCCABD',

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/src/css/style.css"/>

<body class="h-full bg-surface text-on-surface font-sans antialiased overflow-x-hidden">
